<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>WHATGO — Nouveau mot de passe</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%231FAA59'/%3E%3Cpath d='M9 12h14M9 17h9' stroke='white' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#EDF3F0; --ink:#0B1A14; --ink-soft:#4A5C54; --ink-faint:#7F8F87;
  --line:#E2EAE6; --green:#1FAA59; --green-deep:#0C7A40; --red:#C0392B; --red-soft:#FBE9E7;
  --green-soft:#DFF6EA;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:var(--bg);color:var(--ink);min-height:100vh;display:grid;place-items:center;padding:24px;
}
h1{font-family:'Space Grotesk',sans-serif;font-size:1.3rem;margin-bottom:5px}
.card{width:100%;max-width:400px;background:#fff;border:1px solid rgba(255,255,255,.9);border-radius:18px;
  box-shadow:0 12px 28px -16px rgba(11,40,28,.34);padding:28px}
.sub{color:var(--ink-soft);font-size:.88rem;margin-bottom:22px}
.field{margin-bottom:14px}
.field label{display:block;font-size:.78rem;font-weight:600;color:var(--ink-soft);margin-bottom:6px}
input[type=password]{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:9px;font-size:.9rem}
input:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(31,170,89,.13)}
button{width:100%;padding:11px;border:0;border-radius:9px;background:var(--green);color:#fff;
  font-weight:700;font-size:.92rem;cursor:pointer;margin-top:4px}
button:disabled{opacity:.6;cursor:not-allowed}
.msg{font-size:.84rem;margin-top:12px;display:none;line-height:1.5}
.msg.is-on{display:block}
.msg--ok{color:var(--green-deep)}
.msg--err{color:var(--red)}
a{color:var(--green-deep);font-weight:600;text-decoration:none}
</style>
</head>
<body>
<div class="card">
  <h1>Nouveau mot de passe</h1>
  <p class="sub" id="intro">Choisissez un nouveau mot de passe (8 caractères minimum).</p>

  <form id="resetForm">
    <div class="field"><label for="pw1">Nouveau mot de passe</label>
      <input type="password" id="pw1" required minlength="8" autocomplete="new-password" /></div>
    <div class="field"><label for="pw2">Confirmer le mot de passe</label>
      <input type="password" id="pw2" required minlength="8" autocomplete="new-password" /></div>
    <button type="submit" id="submitBtn">Réinitialiser le mot de passe</button>
    <p class="msg msg--ok" id="okMsg"></p>
    <p class="msg msg--err" id="errMsg"></p>
  </form>
</div>

<script>
function $(s) { return document.querySelector(s); }
var params = new URLSearchParams(location.search);
var token = params.get('token');
var email = params.get('email');

if (!token || !email) {
  $('#resetForm').hidden = true;
  $('#intro').textContent = 'Ce lien de réinitialisation est invalide. Redemandez-en un depuis la page de connexion.';
}

$('#resetForm').addEventListener('submit', async function (e) {
  e.preventDefault();
  var errEl = $('#errMsg'), okEl = $('#okMsg');
  errEl.classList.remove('is-on'); okEl.classList.remove('is-on');

  var pw1 = $('#pw1').value, pw2 = $('#pw2').value;
  if (pw1.length < 8) { errEl.textContent = 'Le mot de passe doit contenir au moins 8 caractères.'; errEl.classList.add('is-on'); return; }
  if (pw1 !== pw2) { errEl.textContent = 'Les deux mots de passe ne correspondent pas.'; errEl.classList.add('is-on'); return; }

  var btn = $('#submitBtn');
  btn.disabled = true;
  try {
    var res = await fetch('/api/auth/reset-password', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email, token: token, newPassword: pw1 }),
    });
    var data = await res.json();
    if (!res.ok) { errEl.textContent = data.error || 'Erreur.'; errEl.classList.add('is-on'); return; }
    $('#resetForm').hidden = true;
    okEl.textContent = 'Mot de passe mis à jour. Vous pouvez retourner sur la page de connexion.';
    okEl.classList.add('is-on');
  } catch (err) {
    errEl.textContent = 'Impossible de contacter le serveur.'; errEl.classList.add('is-on');
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
